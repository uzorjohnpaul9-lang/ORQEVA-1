[pytest]
asyncio_mode = auto
# Both scopes MUST be session. The `client` fixture is session-scoped and owns an
# httpx.AsyncClient whose connection pool is bound to the session loop; if tests
# run on per-function loops, every real request fails with SSLWantReadError /
# "Event loop is closed". pytest-asyncio 1.x defaults the test loop to function
# while the fixture loop was pinned to session, so set both explicitly.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
filterwarnings =
    ignore::UserWarning
