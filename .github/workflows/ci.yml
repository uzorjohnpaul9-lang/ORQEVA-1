name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax/compile check
        run: python -m compileall backend engines security payments notifications -q
      - name: Import check (app boots)
        env:
          SECRET_KEY: ci-test-secret-not-for-prod
        run: python -c "from backend.main import app; print('routes:', len(app.routes))"
      - name: Test suite
        env:
          SECRET_KEY: ci-test-secret-not-for-prod
        run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t tradeai-backend:${{ github.sha }} .
      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t tradeai-frontend:${{ github.sha }} .
